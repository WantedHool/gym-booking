services:
  postgres:
    image: postgres:16
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_pw
      POSTGRES_DB: gymbooking
    ports:
      - "5432:5432"
    volumes:
      - gym-postgres-data:/var/lib/postgresql/data # persist data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gymbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  papercut:
    image: changemakerstudiosus/papercut-smtp:latest
    container_name: gym-papercut
    restart: unless-stopped
    ports:
      - "2525:25" # SMTP — εδώ θα "στέλνει" emails το API
      - "8080:80" # Web UI — βλέπεις τα emails στο http://localhost:8080

volumes:
  gym-postgres-data:
