
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_pw
      POSTGRES_DB: gymbooking
    ports:
      - "5432:5432"
    volumes:
      - gym-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gymbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  papercut:
    image: changemakerstudiosus/papercut-smtp:latest
    restart: unless-stopped
    ports:
      - "2525:2525"
      - "8025:8080"

  api:
    build:
      context: ./backend
      dockerfile: src/GymBooking.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=gymbooking;Username=gym;Password=gym_dev_pw"
      Email__SmtpHost: papercut
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      papercut:
        condition: service_started

  customer:
    build:
      context: ./frontend
      args:
        APP: customer
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

  staff:
    build:
      context: ./frontend
      args:
        APP: staff
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      - api

volumes:
  gym-postgres-data:
