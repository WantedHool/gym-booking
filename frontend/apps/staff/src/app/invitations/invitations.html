<div class="app-content-narrow">
  <lib-page-header title="Προσκλήσεις" />

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ρόλος</mat-label>
      <mat-select formControlName="role">
        <mat-option value="User">Μέλος (πελάτης)</mat-option>
        <mat-option value="Instructor">Προπονητής/τρια</mat-option>
      </mat-select>
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="text-sm text-red-400">{{ message }}</p>
    }
    @if (successMessage(); as message) {
      <p class="text-sm text-green-400">{{ message }}</p>
    }

    @if (registerLink()) {
      <div class="mt-4 rounded border p-3">
        <p class="mb-2 break-all font-mono text-sm">{{ registerLink() }}</p>
        <button mat-stroked-button type="button" (click)="copyLink()">
          {{ copied() ? 'Αντιγράφηκε ✓' : 'Αντιγραφή link' }}
        </button>
      </div>
    }

    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      Αποστολή πρόσκλησης
    </button>
  </form>
</div>
