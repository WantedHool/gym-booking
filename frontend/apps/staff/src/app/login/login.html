<div class="min-h-screen flex">
  <div class="hidden lg:flex flex-1 items-center justify-center bg-[var(--mat-sys-primary)] text-white p-12">
    <div class="max-w-md text-center">
      <h1 class="text-3xl font-semibold mb-2">Demo Gym</h1>
      <p class="text-white/80">Πάνελ διαχείρισης προσωπικού</p>
    </div>
  </div>

  <div class="flex flex-1 items-center justify-center p-4 lg:p-12">
    <form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-sm flex flex-col gap-4">
      <h2 class="text-xl font-medium text-center">Σύνδεση</h2>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Κωδικός</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      @if (errorMessage(); as message) {
        <p class="text-sm text-red-600">{{ message }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="submitting()" class="w-full">
        {{ submitting() ? 'Σύνδεση...' : 'Σύνδεση' }}
      </button>
    </form>
  </div>
</div>
