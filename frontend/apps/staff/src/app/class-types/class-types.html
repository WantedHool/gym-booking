<div class="app-content">
  <lib-page-header title="Είδη μαθημάτων">
    <button mat-flat-button color="primary" routerLink="/class-types/new">
      <mat-icon>add</mat-icon>
      Προσθήκη
    </button>
  </lib-page-header>

  @if (errorMessage(); as message) {
    <p class="text-sm text-red-400 mb-4">{{ message }}</p>
  }

  @if (classTypes().length === 0) {
    <div class="app-card app-empty-state">
      <mat-icon class="!text-4xl !w-10 !h-10 mb-2 opacity-40">category</mat-icon>
      <p>Δεν υπάρχουν είδη μαθημάτων ακόμα.</p>
      <button mat-stroked-button routerLink="/class-types/new" class="mt-3">
        <mat-icon>add</mat-icon>
        Προσθήκη πρώτου
      </button>
    </div>
  } @else {
    <div class="flex flex-col gap-3">
      @for (ct of pagination.paginatedItems(); track ct.id) {
        <div class="app-card text-sm text-white">
          <div class="font-medium">{{ ct.name }}</div>
          <div class="text-[var(--app-text-secondary)]">{{ ct.defaultDurationMinutes }}′ / {{ ct.defaultCapacity }} θέσεις</div>
        </div>
      }
    </div>

    <lib-list-paginator
      class="mt-2 block"
      [length]="classTypes().length"
      [pageIndex]="pagination.pageIndex()"
      [pageSize]="pagination.pageSize()"
      (pageChange)="pagination.onPage($event)"
    />
  }
</div>
