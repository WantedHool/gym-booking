<div class="min-h-screen flex flex-col bg-[var(--app-bg-page)]">
  <header class="flex items-center justify-between px-4 py-3 bg-[var(--app-bg-surface)] border-b border-[var(--app-border)]">
    <div class="flex items-center gap-2">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Μενού">
        <mat-icon>menu</mat-icon>
      </button>
      <a routerLink="/dashboard" class="font-semibold text-white no-underline hover:opacity-80 transition-opacity">🏋 GymBooking</a>
      <span class="app-badge">Προσωπικό</span>
    </div>
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Μενού χρήστη">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Αποσύνδεση</span>
      </button>
    </mat-menu>
  </header>

  <mat-sidenav-container class="flex-1 bg-[var(--app-bg-page)]">
    <mat-sidenav
      #drawer
      [mode]="isNarrow() ? 'over' : 'side'"
      [opened]="sidenavOpen()"
      (openedChange)="sidenavOpen.set($event)"
      [autoFocus]="false"
      class="w-56 bg-[var(--app-bg-nav)] border-r border-[var(--app-border)]"
    >
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/dashboard"
          routerLinkActive
          #rlaHome="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [activated]="rlaHome.isActive"
          (click)="isNarrow() && drawer.close()"
        >
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Αρχική</span>
        </a>
        <a
          mat-list-item
          routerLink="/class-types"
          routerLinkActive
          #rlaClassTypes="routerLinkActive"
          [activated]="rlaClassTypes.isActive"
          (click)="isNarrow() && drawer.close()"
        >
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>Είδη μαθημάτων</span>
        </a>
        <a
          mat-list-item
          routerLink="/sessions"
          routerLinkActive
          #rlaSessions="routerLinkActive"
          [activated]="rlaSessions.isActive"
          (click)="isNarrow() && drawer.close()"
        >
          <mat-icon matListItemIcon>event</mat-icon>
          <span matListItemTitle>Ώρες μαθημάτων</span>
        </a>
        @if (isAdmin()) {
          <a
            mat-list-item
            routerLink="/users"
            routerLinkActive
            #rlaUsers="routerLinkActive"
            [activated]="rlaUsers.isActive"
            (click)="isNarrow() && drawer.close()"
          >
            <mat-icon matListItemIcon>group</mat-icon>
            <span matListItemTitle>Χρήστες</span>
          </a>
          <a
            mat-list-item
            routerLink="/invitations"
            routerLinkActive
            #rlaInvitations="routerLinkActive"
            [activated]="rlaInvitations.isActive"
            (click)="isNarrow() && drawer.close()"
          >
            <mat-icon matListItemIcon>mail</mat-icon>
            <span matListItemTitle>Προσκλήσεις</span>
          </a>
          <a
            mat-list-item
            routerLink="/memberships"
            routerLinkActive
            #rlaMemberships="routerLinkActive"
            [activated]="rlaMemberships.isActive"
            (click)="isNarrow() && drawer.close()"
          >
            <mat-icon matListItemIcon>card_membership</mat-icon>
            <span matListItemTitle>Συνδρομές</span>
          </a>
          <a
            mat-list-item
            routerLink="/settings"
            routerLinkActive
            #rlaSettings="routerLinkActive"
            [activated]="rlaSettings.isActive"
            (click)="isNarrow() && drawer.close()"
          >
            <mat-icon matListItemIcon>settings</mat-icon>
            <span matListItemTitle>Ρυθμίσεις</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="p-4 lg:p-8 max-w-5xl mx-auto">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
