# Serve το Angular SPA static build. Το frontend καλεί το API με absolute URL (http://localhost:8080)
# μέσω CORS — δεν χρειάζεται reverse-proxy εδώ. Μόνο SPA fallback ώστε τα deep links / reloads σε
# Angular routes (π.χ. /schedule, /users) να επιστρέφουν το index.html αντί για 404.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache-busting: τα hashed assets (main-XXXX.js) cache-άρονται μακροχρόνια, το index.html όχι.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
